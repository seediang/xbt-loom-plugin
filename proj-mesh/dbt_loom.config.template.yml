# dbt-loom configuration template
# This file can be customized with Jinja2 variables and environment variables
#
# Jinja2 variables available:
#   - {{ project_root }}: Root directory of this dbt project
#   - {{ profiles_dir }}: Path to profiles directory (if resolved)
#   - {{ project_name }}: Name of this project from dbt_project.yml
#   - {{ upstream_projects }}: List of upstream project dicts with keys:
#       - name
#       - upstream_project
#       - manifest_path (relative)
#       - manifest_path_abs (absolute)
#       - manifest_type
#       - config (optional)
#       - excluded_packages (optional)
#
# Environment variables:
#   - ${VAR_NAME} or $VAR_NAME format supported
#
# Jinja2 defaults:
#   - Use default('value', true) if you want None/empty values to fall back.
#
# Manifest types supported: file, s3, gcs, azure, dbt_cloud, paradime, snowflake, databricks
#
# Default template (file-based manifest):
manifests:
{% for project in upstream_projects %}
  - name: {{ project.name }}
    type: {{ project.manifest_type | default('file') }}
    config:
      path: {{ project.manifest_path }}
{% endfor %}
#
# Example for S3 manifest with environment variables:
{% raw %}
# manifests:
#   - name: {{ project.name }}
#     type: s3
#     config:
#       bucket_name: ${S3_BUCKET}
#       object_name: manifests/{{ project.name }}/manifest.json
#
# Example for GCS manifest:
# manifests:
#   - name: {{ project.name }}
#     type: gcs
#     config:
#       project_id: ${GCP_PROJECT_ID}
#       bucket_name: ${GCS_BUCKET}
#       object_name: manifests/{{ project.name }}/manifest.json
#       credentials: ${GOOGLE_APPLICATION_CREDENTIALS}
#
# Example for dbt Cloud:
# manifests:
#   - name: {{ project.name }}
#     type: dbt_cloud
#     config:
#       account_id: ${DBT_CLOUD_ACCOUNT_ID}
#       job_id: ${DBT_CLOUD_JOB_ID}
#       api_endpoint: ${DBT_CLOUD_API_URL}
{% endraw %}
#
# If this file does not exist, the xbt-loom-auto-configure plugin will generate one
