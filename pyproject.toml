[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[project]
name = "xbt-loom-plugin"
version = "0.1.0"
description = "xbt plugin for dbt-loom auto-configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-loom>=0.9.4",
    "xbt",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.entry-points.xbt]
"xbt-loom-auto-configure" = "xbt_loom_plugin.auto_configuration"
"xbt-loom-zip-artifacts" = "xbt_loom_plugin.artifact_zipper"

[tool.uv.sources]
xbt = { git = "https://github.com/seediang/xbt-core", rev = "develop" }
